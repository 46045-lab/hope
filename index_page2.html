<!DOCTYPE html>
<html>

<style>
body {
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  display: grid;
  grid-template-columns: 1fr; /*1 row type shi */
  gap: 15px;
  width: 750px;
}


button {
  padding: 18px;
  font-size: 18px;
  width: 100%;
}


.full {
  background: #ccc;
}
</style>
</head>
    <title>Selection page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body style="background-color:lightgreen">

  <form id="sendForm"
      action="https://script.google.com/macros/s/AKfycbz9ERVWyEpcHVgeuoTw59gtrl21km7HzwQFyfKyjl4CJj6hfTKJHj65f6aIo0q7lgzE/exec"
      method="POST"
      style="display:none;">

  <input name="name">
  <input name="sur">
  <input name="nick">
  <input name="id">
  <input name="clazz">
  <input name="classNum">
  <input name="instrument">
</form>

<div class="container">
  <button onclick="choose('Welfare Division')" id="Welfare Division"></button>
  <button onclick="choose('Equipment & Instrument Division')" id="Equipment & Instrument Division"></button>
  <button onclick="choose('Public Relation')" id="Public Relation"></button>
  <button onclick="choose('Human Resources')" id="Human Resources"></button>
</div>

<button onclick="HARD_RESET()">🔥 HARD RESET</button>





<script>
const MAX = 15;
const OPTIONS = ["Welfare Division","Equipment & Instrument Division","Public Relation","Human Resources"];

// ❌ ถ้าเคยเลือกแล้ว → ไปหน้า 3 ทันที
/*if (localStorage.getItem("chosen")) {
  location.href = "index_page3.html";
}*/

// init counter
OPTIONS.forEach(o => {
  if (localStorage.getItem(o) === null) {
    localStorage.setItem(o, 0);
  }
});

function render() {
  OPTIONS.forEach(o => {
    const used = parseInt(localStorage.getItem(o));
    const btn = document.getElementById(o);

    if (used >= MAX) {
      btn.textContent = o + " (FULL)";
      btn.disabled = true;
    } else {
      btn.textContent = o + " (" + (MAX - used) + " left)";
    }
  });
}

function choose(opt) {
  let used = parseInt(localStorage.getItem(opt));
  if (used >= MAX) return;

  // update count
  localStorage.setItem(opt, used + 1);
  localStorage.setItem("chosen", opt);

  sendToGoogleSheet(opt);
}



function HARD_RESET() {
  alert("RESET CLICKED"); // 👈 ต้องเด้งก่อน

  localStorage.clear();  // 👈 ล้างทุกอย่าง

  alert("localStorage cleared");
  location.reload();     // รีเฟรชหน้า
}




function sendToGoogleSheet(choice) {
  const user = JSON.parse(localStorage.getItem("userInfo"));

  fetch("https://script.google.com/macros/s/AKfycbzF-YegtOlcgP0rF-_bIBI6tt8xjqis0y2jVYgqQhzGjrrR33BdTzczbojlKEDzbg5v/exec", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: user.name,
      sur: user.sur,
      nick: user.nick,
      id: user.id,
      clazz: user.clazz,
      classNum: user.classNum,
      instrument: user.instrument,
      choice: choice
    })
  })
  .then(res => res.text())
  .then(txt => {
    console.log("SERVER:", txt);
    localStorage.setItem("submitted", "yes");
    location.href = "index_page3.html";
  })
  .catch(err => {
    console.error("FETCH ERROR", err);
    alert("Send failed");
  });
}



render();
</script>


</body>
</html>
